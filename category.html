<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOP SEAL | Category</title>
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="assets/top-seal-favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="page-loading-overlay" class="page-loading-overlay">
    <div class="page-loading-card"><div class="page-loading-spinner" aria-hidden="true"></div><p>Loading store…</p></div>
  </div>
  <div class="top-nav" id="top-nav">
    <div class="container top-nav-inner">
      <a class="top-nav-brand" id="top-nav-brand" href="index.html">
        <img class="brand-logo" id="brand-logo" src="assets/top-seal-mark.svg" alt="TOP SEAL logo" />
        <span class="brand-name" id="brand-name-label">TOP SEAL</span>
      </a>
      <button class="top-nav-toggle" id="top-nav-toggle" type="button" aria-expanded="false" aria-controls="top-nav-links">Menu</button>
      <form class="top-nav-search" id="top-nav-search" role="search">
        <input id="top-nav-search-input" type="search" placeholder="Search products..." aria-label="Search products" />
        <button type="submit">Search</button>
      </form>
      <nav class="top-nav-links" id="top-nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <div class="nav-dropdown" id="category-dropdown">
          <a href="index.html#category-featured-sections" class="nav-dropdown-trigger">Categories</a>
          <div class="nav-dropdown-menu" id="category-dropdown-menu" role="menu" aria-label="Category quick links"></div>
        </div>
        <div class="nav-dropdown" id="subcategory-dropdown">
          <a href="#subcategory-list" class="nav-dropdown-trigger">Sub-Categories</a>
          <div class="nav-dropdown-menu" id="subcategory-dropdown-menu" role="menu" aria-label="Sub-category quick links"></div>
        </div>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>
  <div class="broadcast-bar hidden" id="broadcast-bar" aria-live="polite">
    <div class="broadcast-track"><span id="broadcast-text">Announcement</span></div>
  </div>
  <header class="site-header compact">
    <div class="container">
      <p class="brand-tag" id="brand-tag">TOP SEAL</p>
      <h1 id="category-title">Category</h1>
      <a class="back-link" href="index.html">&larr; Back to main categories</a>
    </div>
  </header>

  <main class="container">
    <section id="category-slider-wrap" class="slider-wrap hidden">
      <div class="slider" id="category-slider"></div>
    </section>

    <section class="category-page-block">
      <h2>Sub-Categories</h2>
      <div id="subcategory-list" class="subcategory-list"></div>

      <h2 id="products-title">Products</h2>
      <div id="products-list" class="products-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <section>
        <h2 class="footer-title">Sub-Categories</h2>
        <p class="footer-text footer-links-inline" id="footer-subcategories"></p>
      </section>
      <section>
        <h2 class="footer-title">Contact</h2>
        <p class="footer-text" id="footer-brand">TOP SEAL</p>
        <p class="footer-text"><a class="footer-link" id="footer-whatsapp" href="#" target="_blank" rel="noopener noreferrer">WhatsApp Chat</a></p>
        <p class="footer-text" id="footer-address"></p>
        <p class="footer-text"><a class="footer-link" id="footer-map-link" href="#" target="_blank" rel="noopener noreferrer">View on Map</a></p>
      </section>
      <section>
        <h2 class="footer-title">Business Hours</h2>
        <ul class="footer-hours" id="footer-hours"></ul>
      </section>
      <section>
        <h2 class="footer-title">Follow Us</h2>
        <div class="footer-social" id="footer-social"></div>
      </section>
    </div>
  </footer>

  <script src="shop-data.js"></script>
  <script>
    (async () => {
    setupPageLoadingScreen();
    try {
    const data = await loadTopSealData();
    applyStoreTheme(data.settings || {});
    setupBroadcastBar(data.settings || {});
    const popupReady = setupEntryPopup(data.settings || {});
    setupSideAds(data.settings || {});
    setupAmbientGlowThreads(data.settings || {});
    setupFloatingWhatsApp(data.settings || {});
    const params = new URLSearchParams(window.location.search);
    const catSlug = params.get("cat");
    const selectedSubSlugFromUrl = params.get("sub");

    const brandName = data.settings?.brandName || "TOP SEAL";
    document.title = `${brandName} | Category`;
    const whatsapp = data.settings?.whatsappNumber || "8801894527991";
    document.getElementById("brand-tag").textContent = brandName;
    document.getElementById("footer-brand").textContent = brandName;
    document.getElementById("footer-whatsapp").href = `https://wa.me/${whatsapp}?text=${encodeURIComponent(`Hello ${brandName}`)}`;
    document.getElementById("footer-address").textContent = data.settings?.contactAddress || "";

    const mapLinkEl = document.getElementById("footer-map-link");
    const mapLink = data.settings?.mapLink || "";
    if (mapLink) {
      mapLinkEl.href = mapLink;
      mapLinkEl.classList.remove("hidden");
    } else {
      mapLinkEl.classList.add("hidden");
    }

    const hoursList = document.getElementById("footer-hours");
    const hours = (data.settings?.businessHours || "").split("\n").map((line) => line.trim()).filter(Boolean);
    hoursList.innerHTML = "";
    hours.forEach((line) => {
      const li = document.createElement("li");
      li.textContent = line;
      hoursList.appendChild(li);
    });

    const socialContainer = document.getElementById("footer-social");
    socialContainer.innerHTML = "";
    [
      { label: "Facebook", href: data.settings?.facebookUrl },
      { label: "Instagram", href: data.settings?.instagramUrl },
      { label: "YouTube", href: data.settings?.youtubeUrl }
    ].filter((item) => item.href).forEach((item) => {
      const a = document.createElement("a");
      a.className = "footer-link";
      a.href = item.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = item.label;
      socialContainer.appendChild(a);
    });


    document.getElementById("brand-name-label").textContent = brandName;
    const logoEl = document.getElementById("brand-logo");
    logoEl.src = data.settings?.brandLogoImage || "assets/top-seal-mark.svg";
    const dynamicFavicon = document.getElementById("dynamic-favicon");
    dynamicFavicon.href = data.settings?.faviconImage || "assets/top-seal-favicon.svg";

    const categoryDropdownMenu = document.getElementById("category-dropdown-menu");
    setupSubcategoryDropdown(data);
    data.categories.forEach((catItem) => {
      const item = document.createElement("a");
      item.href = `category.html?cat=${catItem.slug}`;
      item.textContent = catItem.label;
      item.setAttribute("role", "menuitem");
      categoryDropdownMenu.appendChild(item);
    });

    const footerSub = document.getElementById("footer-subcategories");
    const subLinks = [];
    data.categories.forEach((cat) => cat.subcategories.forEach((sub) => {
      const a = document.createElement("a");
      a.className = "footer-link";
      a.href = `category.html?cat=${cat.slug}&sub=${sub.slug}`;
      a.textContent = sub.label;
      subLinks.push(a);
    }));
    subLinks.forEach((a) => {
      const row = document.createElement("span");
      row.className = "footer-subcategory-row";
      row.appendChild(a);
      footerSub.appendChild(row);
    });

    const category = data.categories.find((cat) => cat.slug === catSlug);

    const title = document.getElementById("category-title");
    const subcategoryList = document.getElementById("subcategory-list");
    const productsTitle = document.getElementById("products-title");
    const productsList = document.getElementById("products-list");

    function setupCategorySlider(images) {
      if (!images || !images.length) return;
      const wrap = document.getElementById("category-slider-wrap");
      const slider = document.getElementById("category-slider");
      wrap.classList.remove("hidden");
      slider.innerHTML = "";

      const intervalMs = Math.min(10000, Math.max(2000, Number(data.settings?.slideIntervalMs) || 3200));
      const viewport = document.createElement("div");
      viewport.className = "smooth-slider";
      const track = document.createElement("div");
      track.className = "smooth-slider-track";

      const deck = [images[images.length - 1], ...images, images[0]];
      deck.forEach((src, idx) => {
        const img = document.createElement("img");
        img.className = "smooth-slide-image";
        img.alt = `Category slideshow image ${idx + 1}`;
        const v = buildImageVariantSet(src);
        img.src = v.large;
        img.srcset = `${v.small} 420w, ${v.medium} 820w, ${v.large} 1280w`;
        img.sizes = "100vw";
        img.decoding = "async";
        track.appendChild(img);
      });

      viewport.appendChild(track);
      slider.appendChild(viewport);

      const prevBtn = document.createElement("button");
      prevBtn.type = "button";
      prevBtn.className = "slider-arrow slider-arrow-prev";
      prevBtn.setAttribute("aria-label", "Previous slide");
      prevBtn.textContent = "‹";

      const nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "slider-arrow slider-arrow-next";
      nextBtn.setAttribute("aria-label", "Next slide");
      nextBtn.textContent = "›";

      slider.append(prevBtn, nextBtn);

      const dots = document.createElement("div");
      dots.className = "slider-dots";
      images.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "slider-dot" + (i === 0 ? " active" : "");
        dot.setAttribute("aria-label", `Go to slide ${i + 1}`);
        dot.addEventListener("click", () => goTo(i + 1));
        dots.appendChild(dot);
      });
      slider.appendChild(dots);

      let index = 1;
      let timer = null;
      let isAnimating = false;

      function renderDots() {
        dots.querySelectorAll(".slider-dot").forEach((dot, i) => dot.classList.toggle("active", i === (index - 1 + images.length) % images.length));
      }

      function move(animate = true) {
        if (!animate) {
          const previousTransition = track.style.transition;
          track.style.transition = "none";
          track.style.transform = `translate3d(-${index * 100}%, 0, 0)`;
          void track.offsetWidth;
          track.style.transition = previousTransition;
        } else {
          track.style.transform = `translate3d(-${index * 100}%, 0, 0)`;
        }
        renderDots();
      }

      function goTo(next) {
        if (isAnimating) return;
        isAnimating = true;
        index = next;
        move(true);
      }

      track.addEventListener("transitionend", () => {
        isAnimating = false;
        if (index === 0) {
          index = images.length;
          move(false);
        } else if (index === images.length + 1) {
          index = 1;
          move(false);
        }
      });

      function startAuto() {
        stopAuto();
        timer = setInterval(() => goTo(index + 1), intervalMs);
      }
      function stopAuto() {
        if (timer) clearInterval(timer);
        timer = null;
      }

      prevBtn.addEventListener("click", () => goTo(index - 1));
      nextBtn.addEventListener("click", () => goTo(index + 1));
      slider.addEventListener("mouseenter", stopAuto);
      slider.addEventListener("mouseleave", startAuto);
      slider.addEventListener("focusin", stopAuto);
      slider.addEventListener("focusout", startAuto);

      move(false);
      startAuto();
    }


    function buildBadges(product) {
      const badgeMap = {
        "new": "New",
        "hot": "Hot",
        "best-seller": "Best Seller"
      };
      const badges = (product.badges || []).map((key) => badgeMap[key]).filter(Boolean);
      const stockText = (product.stock || "").toLowerCase();
      if (stockText && !stockText.includes("out") && !stockText.includes("unavailable")) {
        badges.push("In Stock");
      }
      if (!badges.length) return "";
      const badgeMeta = {
        "new": { icon: "✦", cls: "is-new" },
        "hot": { icon: "🔥", cls: "is-hot" },
        "best seller": { icon: "⭐", cls: "is-best" },
        "in stock": { icon: "●", cls: "is-stock" }
      };
      return `<div class="product-badges overlay">${badges.map((badge) => {
        const key = String(badge || "").toLowerCase();
        const meta = badgeMeta[key] || { icon: "✦", cls: "is-default" };
        return `<span class="product-badge ${meta.cls}"><span class="badge-icon" aria-hidden="true">${meta.icon}</span>${badge}</span>`;
      }).join("")}</div>`;
    }

    function renderProducts(subSlug) {
      const sub = category.subcategories.find((item) => item.slug === subSlug);
      productsTitle.textContent = `${sub.label} Products`;
      productsList.innerHTML = "";

      const products = data.products.filter((product) => product.subcategoryId === sub.id);
      if (!products.length) {
        productsList.innerHTML = "<p>No products available in this sub-category.</p>";
        return;
      }

      products.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product-card";

        const image = product.imageData
          ? `<img src="${optimizeImageSource(product.imageData, { width: 520 })}" alt="${product.name}" class="product-card-image" loading="lazy" decoding="async" />`
          : `<div class="product-card-placeholder">No Image</div>`;

        card.innerHTML = `
          <div class="product-media">
            ${image}
            ${buildBadges(product)}
          </div>
          <h3>${product.name}</h3>
          <p class="product-card-price">৳ ${product.price || "Ask Price"}</p>
          <a class="order-button" href="product.html?item=${product.slug}"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="whatsapp-icon bi bi-whatsapp" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/></svg>Order</a>
        `;

        productsList.appendChild(card);
      });
    }

    if (!category) {
      title.textContent = "Category not found";
      subcategoryList.innerHTML = "<p>Please return and choose a valid category.</p>";
      productsTitle.textContent = "";
    } else {
      title.textContent = category.label;
      setupCategorySlider(data.homeSlides || []);

      const subSlugs = category.subcategories.map((sub) => sub.slug);
      const initialSubSlug = subSlugs.includes(selectedSubSlugFromUrl) ? selectedSubSlugFromUrl : subSlugs[0];

      category.subcategories.forEach((sub) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = sub.label;
        button.className = "subcategory-btn";

        button.addEventListener("click", () => {
          document.querySelectorAll(".subcategory-btn").forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
          renderProducts(sub.slug);

          const nextParams = new URLSearchParams(window.location.search);
          nextParams.set("sub", sub.slug);
          history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);
        });

        if (sub.slug === initialSubSlug) {
          button.classList.add("active");
          renderProducts(sub.slug);
        }

        subcategoryList.appendChild(button);
      });
    }

    setupTopNavSearch(data);

    const navToggle = document.getElementById("top-nav-toggle");
    const topNav = document.getElementById("top-nav");
    const navLinks = document.getElementById("top-nav-links");
    navToggle?.addEventListener("click", () => {
      const expanded = navToggle.getAttribute("aria-expanded") === "true";
      navToggle.setAttribute("aria-expanded", String(!expanded));
      topNav.classList.toggle("open", !expanded);
    });
    navLinks?.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        navToggle?.setAttribute("aria-expanded", "false");
        topNav.classList.remove("open");
      });
    });
    await popupReady;
    } finally {
      hidePageLoadingScreen();
    }
    })();
  </script>
</body>
</html>
