<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOP SEAL Admin Login</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="login-shell">
    <section class="card login-card">
      <h1>TOP SEAL Admin</h1>
      <p class="muted">Sign in with your admin username and password.</p>
      <form id="login-form">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required />
        </div>
        <div class="inline-actions" style="margin-top: 0.8rem;">
          <button type="submit">Login</button>
        </div>
      </form>
      <p id="login-notice" class="notice"></p>
      <p class="small muted">Initial demo credential: <strong>admin / topseal123</strong> (change in backend phase).</p>
    </section>
  </main>
  <script src="shop-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
